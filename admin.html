<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oaklands Admin Dashboard</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
  .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  h1 { color: #4A148C; margin-bottom: 20px; }
  .stats { display: flex; gap: 20px; margin-bottom: 30px; }
  .stat-box { background: #F3E5F5; padding: 20px; border-radius: 10px; flex: 1; text-align: center; }
  .stat-box h3 { color: #4A148C; font-size: 2rem; margin: 0; }
  .stat-box p { color: #666; margin: 5px 0 0; font-weight: bold; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  th { background: #4A148C; color: white; font-weight: 600; }
  tr:hover { background: #f9f9f9; }
  
  .btn { background: #4A148C; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-bottom: 20px; }
  .btn:hover { background: #7B1FA2; }
  
  @media print {
    .btn { display: none; }
    body { background: white; padding: 0; }
    .container { box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <h1> Oaklands MDD & Graduation - Payment Dashboard</h1>
  <button class="btn" onclick="window.print()"> Print List for Gate Staff</button>
  <button class="btn" onclick="location.reload()" style="background:#10B981;">🔄 Refresh Data</button>

  <div class="stats">
    <div class="stat-box">
      <h3 id="totalBookings">0</h3>
      <p>Total Bookings</p>
    </div>
    <div class="stat-box">
      <h3 id="totalAmount">UGX 0</h3>
      <p>Total Collected</p>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ref Code</th>
        <th>Parent Name</th>
        <th>Phone</th>
        <th>Child Name / Class</th>
        <th>Type</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>MoMo Ref</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="9" style="text-align:center;">Loading data...</td></tr>
    </tbody>
  </table>
</div>

<script>
  async function loadData() {
    try {
      const res = await fetch('/api/bookings');
      const data = await res.json();
      
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      
      let totalAmt = 0;

      data.forEach(b => {
        totalAmt += b.amount || 0;
        const date = new Date(b.createdAt).toLocaleString();
        const childInfo = b.ticketType === 'child' ? `${b.childName || '-'} (${b.childClass || '-'})` : '-';
        
        const row = `
          <tr>
            <td><b>${b.ref}</b></td>
            <td>${b.parentName}</td>
            <td>${b.phone}</td>
            <td>${childInfo}</td>
            <td>${b.ticketType === 'child' ? 'Participation' : 'Visitor'}</td>
            <td>${b.numTickets || 1}</td>
            <td>UGX ${(b.amount || 0).toLocaleString()}</td>
            <td>${b.momoRef || '-'}</td>
            <td>${date}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      document.getElementById('totalBookings').innerText = data.length;
      document.getElementById('totalAmount').innerText = 'UGX ' + totalAmt.toLocaleString();

    } catch (err) {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="9" style="text-align:center; color:red;">Error loading data. Check console.</td></tr>';
    }
  }
  
  loadData();
</script>
</body>
</html>
