<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oaklands Admin Dashboard</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; color: #333; margin: 0; }
  .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  h1 { color: #4A148C; margin-bottom: 20px; font-size: 1.8rem; }
  .controls { display: flex; gap: 15px; margin-bottom: 30px; }
  .stats { display: flex; gap: 20px; margin-bottom: 30px; }
  .stat-box { background: #F3E5F5; padding: 20px; border-radius: 10px; flex: 1; text-align: center; border: 1px solid #E1BEE7; }
  .stat-box h3 { color: #4A148C; font-size: 2rem; margin: 0; }
  .stat-box p { color: #666; margin: 5px 0 0; font-weight: bold; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
  th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #4A148C; color: white; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; }
  tr:hover { background: #f9f9f9; }
  
  .btn { border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; color: white; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.9; }
  .btn-print { background: #4A148C; }
  .btn-refresh { background: #10B981; }
  
  .error-msg { text-align: center; padding: 20px; color: #d32f2f; background: #ffebee; border-radius: 8px; margin: 20px 0; }
  
  @media print {
    .controls { display: none; }
    body { background: white; padding: 0; }
    .container { box-shadow: none; padding: 0; max-width: 100%; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    th { background: #ddd !important; color: black !important; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Oaklands MDD & Graduation - Payment Dashboard</h1>
  
  <div class="controls">
    <button class="btn btn-print" onclick="window.print()">🖨 Print List for Gate Staff</button>
    <button class="btn btn-refresh" onclick="loadData()">🔄 Refresh Data</button>
  </div>

  <div class="stats">
    <div class="stat-box">
      <h3 id="totalBookings">0</h3>
      <p>Total Bookings</p>
    </div>
    <div class="stat-box">
      <h3 id="totalAmount">UGX 0</h3>
      <p>Total Collected</p>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ref Code</th>
        <th>Parent Name</th>
        <th>Phone</th>
        <th>Child Name / Class</th>
        <th>Type</th>
        <th>Qty</th>
        <th>Amount</th>
        <th>MoMo Ref</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="9" style="text-align:center; padding: 30px;">Loading data...</td></tr>
    </tbody>
  </table>
</div>

<script>
  async function loadData() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Loading data...</td></tr>';
    
    try {
      const res = await fetch('/api/bookings');
      if (!res.ok) throw new Error('Failed to fetch');
      const data = await res.json();
      
      tbody.innerHTML = '';
      let totalAmt = 0;

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color: #666; padding: 20px;">No bookings found yet.</td></tr>';
      }

      data.forEach(b => {
        totalAmt += b.amount || 0;
        const date = new Date(b.createdAt).toLocaleString();
        const childInfo = b.ticketType === 'child' ? `${b.childName || '-'} (${b.childClass || '-'})` : '-';
        
        const row = `
          <tr>
            <td><b>${b.ref || 'N/A'}</b></td>
            <td>${b.parentName}</td>
            <td>${b.phone}</td>
            <td>${childInfo}</td>
            <td>${b.ticketType === 'child' ? 'Participation' : 'Visitor'}</td>
            <td>${b.numTickets || 1}</td>
            <td>UGX ${(b.amount || 0).toLocaleString()}</td>
            <td>${b.momoRef || '-'}</td>
            <td>${date}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      document.getElementById('totalBookings').innerText = data.length;
      document.getElementById('totalAmount').innerText = 'UGX ' + totalAmt.toLocaleString();

    } catch (err) {
      console.error(err);
      tbody.innerHTML = `<tr><td colspan="9" class="error-msg">Error loading data. <br><small>Check console or ensure database is connected.</small></td></tr>`;
    }
  }
  
  // Load data on startup
  loadData();
</script>
</body>
</html>
